<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Butterfly Garden</title>

  <!-- ฟอนต์ภาษาไทยแนวน่ารัก -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ONNX Runtime Web : ตัวรันโมเดล .onnx บนเบราว์เซอร์ -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
  <script defer src="script.js"></script>

  <style>
    :root{
      --bg:#fff6f8;
      --bg-2:#ffe9ef;
      --card:#ffffffcc;
      --ink:#5b3a48;
      --ink-soft:#9a7584;
      --pink:#f7a8c0;
      --pink-deep:#e07a9b;
      --leaf:#a8d5b4;
      --leaf-deep:#79b98b;
      --line:#f6d3de;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      font-family:"Mali",system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%, #ffe1ea 0, transparent 38%),
        radial-gradient(circle at 90% 20%, #e8f6ec 0, transparent 35%),
        radial-gradient(circle at 50% 100%, #ffe6ee 0, transparent 45%),
        var(--bg);
      min-height:100vh;
      overflow-x:hidden;
    }

    /* ---------- ผีเสื้อลอยพื้นหลัง ---------- */
    .flutter{position:fixed;pointer-events:none;z-index:0;opacity:.85}
    .flutter svg{display:block}
    .flutter .wingL,.flutter .wingR{transform-box:fill-box;animation:flap 0.9s ease-in-out infinite}
    .flutter .wingL{transform-origin:right center}
    .flutter .wingR{transform-origin:left center}
    @keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
    .f1{top:8%;left:6%;animation:drift1 14s ease-in-out infinite}
    .f2{top:58%;right:5%;animation:drift2 17s ease-in-out infinite}
    .f3{bottom:6%;left:10%;animation:drift1 19s ease-in-out infinite reverse}
    @keyframes drift1{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(40px,-30px) rotate(8deg)}}
    @keyframes drift2{0%,100%{transform:translate(0,0) rotate(10deg)}50%{transform:translate(-50px,25px) rotate(-6deg)}}

    /* ---------- เถาใบไม้มุมจอ ---------- */
    .vine{position:fixed;pointer-events:none;z-index:0;opacity:.9}
    .vine.tl{top:-10px;left:-10px}
    .vine.br{bottom:-10px;right:-10px;transform:rotate(180deg)}

    main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:40px 16px 60px}

    header{text-align:center;margin-bottom:28px}
    .hero-bfly{width:86px;height:auto;margin:0 auto 6px;display:block}
    h1{font-size:clamp(26px,5vw,38px);margin:0;font-weight:700;letter-spacing:.3px}
    h1 span{color:var(--pink-deep)}
    .sub{color:var(--ink-soft);margin:8px 0 0;font-size:15px}
    .status{
      display:inline-flex;align-items:center;gap:8px;margin-top:14px;
      padding:6px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
      font-size:13px;color:var(--ink-soft)
    }
    .dot{width:9px;height:9px;border-radius:50%;background:#f4c76b;animation:pulse 1.2s infinite}
    .status.ready .dot{background:var(--leaf-deep);animation:none}
    .status.error .dot{background:#e0607e;animation:none}
    @keyframes pulse{50%{opacity:.35}}

    .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}

    .card{
      background:var(--card);backdrop-filter:blur(6px);
      border:1.5px solid var(--line);border-radius:26px;padding:20px;
      box-shadow:0 10px 30px -18px #e07a9b55;
    }
    .card h2{font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
    .card h2 .ic{font-size:18px}

    /* ---------- กล่องอัปโหลด ---------- */
    .drop{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:340px;border:2px dashed var(--pink);border-radius:20px;background:#fff9fb;
      cursor:pointer;transition:.2s;text-align:center;overflow:hidden
    }
    .drop:hover,.drop.over{background:#ffeef3;border-color:var(--pink-deep)}
    .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
    .drop .hint{color:var(--ink-soft);font-size:14px;margin-top:6px}
    .drop .big{font-size:16px;font-weight:600}
    .drop .flower{width:58px;margin-bottom:10px}
    .drop.has-img{min-height:0;padding:0;border-style:solid;background:#fff}
    .drop.has-img .empty{display:none}
    canvas{display:none;max-width:100%;height:auto;border-radius:18px}
    .drop.has-img canvas{display:block}

    .tools{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
    .tools label{font-size:13px;color:var(--ink-soft)}
    input[type=range]{accent-color:var(--pink-deep);flex:1;min-width:140px}
    .btn{
      font-family:inherit;font-size:14px;border:none;border-radius:999px;padding:9px 18px;
      background:var(--pink);color:#fff;font-weight:600;cursor:pointer;transition:.2s
    }
    .btn:hover{background:var(--pink-deep)}
    .btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid var(--pink)}

    /* ---------- ผลลัพธ์ ---------- */
    .result-empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 10px}
    .result-empty svg{width:70px;opacity:.8;margin-bottom:6px}
    .item{
      display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;
      background:#fff;border:1.5px solid var(--line);margin-bottom:10px
    }
    .swatch{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px}
    .item .name{font-weight:600;font-size:15px}
    .item .en{font-size:12px;color:var(--ink-soft)}
    .bar{height:7px;border-radius:99px;background:#fbe3ea;margin-top:6px;overflow:hidden}
    .bar i{display:block;height:100%;border-radius:99px}
    .pct{margin-left:auto;font-weight:700;font-size:15px}
    .meta{font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:right}

    .classes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .chip{font-size:12px;padding:5px 11px;border-radius:999px;background:#fff;border:1.5px solid var(--line)}

    footer{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:30px}
    footer svg{width:120px;display:block;margin:0 auto 6px}
  </style>
</head>
<body>

  <!-- ===== ตกแต่ง: เถาใบไม้ ===== -->
  <svg class="vine tl" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
    <path d="M0 30 C60 40 90 80 110 140 S170 210 210 215" fill="none" stroke="#9fcfab" stroke-width="3" stroke-linecap="round"/>
    <g fill="#bfe3c8">
      <ellipse cx="40" cy="38" rx="16" ry="8" transform="rotate(25 40 38)"/>
      <ellipse cx="80" cy="70" rx="17" ry="8" transform="rotate(55 80 70)"/>
      <ellipse cx="102" cy="112" rx="16" ry="8" transform="rotate(70 102 112)"/>
      <ellipse cx="135" cy="170" rx="16" ry="8" transform="rotate(40 135 170)"/>
    </g>
    <g fill="#f7b6c8"><circle cx="64" cy="48" r="7"/><circle cx="120" cy="150" r="6"/><circle cx="175" cy="200" r="7"/></g>
    <g fill="#fff"><circle cx="64" cy="48" r="2.5"/><circle cx="120" cy="150" r="2"/><circle cx="175" cy="200" r="2.5"/></g>
  </svg>
  <svg class="vine br" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true">
    <path d="M0 30 C60 40 90 80 110 140 S170 210 210 215" fill="none" stroke="#9fcfab" stroke-width="3" stroke-linecap="round"/>
    <g fill="#bfe3c8">
      <ellipse cx="40" cy="38" rx="16" ry="8" transform="rotate(25 40 38)"/>
      <ellipse cx="80" cy="70" rx="17" ry="8" transform="rotate(55 80 70)"/>
      <ellipse cx="135" cy="170" rx="16" ry="8" transform="rotate(40 135 170)"/>
    </g>
    <g fill="#f7b6c8"><circle cx="64" cy="48" r="7"/><circle cx="175" cy="200" r="7"/></g>
  </svg>

  <!-- ===== ตกแต่ง: ผีเสื้อบินได้ ===== -->
  <div class="flutter f1" aria-hidden="true">
    <svg width="54" height="44" viewBox="0 0 54 44">
      <g class="wingL"><path d="M27 22 C14 2 0 4 3 16 C5 24 16 24 27 22Z" fill="#f9b8cc"/><path d="M27 23 C16 26 6 34 12 40 C18 44 25 34 27 23Z" fill="#fcd3df"/></g>
      <g class="wingR"><path d="M27 22 C40 2 54 4 51 16 C49 24 38 24 27 22Z" fill="#f9b8cc"/><path d="M27 23 C38 26 48 34 42 40 C36 44 29 34 27 23Z" fill="#fcd3df"/></g>
      <rect x="25.6" y="12" width="2.8" height="22" rx="1.4" fill="#7a5263"/>
    </svg>
  </div>
  <div class="flutter f2" aria-hidden="true">
    <svg width="46" height="38" viewBox="0 0 54 44">
      <g class="wingL"><path d="M27 22 C14 2 0 4 3 16 C5 24 16 24 27 22Z" fill="#bcd9f7"/><path d="M27 23 C16 26 6 34 12 40 C18 44 25 34 27 23Z" fill="#d9e9fb"/></g>
      <g class="wingR"><path d="M27 22 C40 2 54 4 51 16 C49 24 38 24 27 22Z" fill="#bcd9f7"/><path d="M27 23 C38 26 48 34 42 40 C36 44 29 34 27 23Z" fill="#d9e9fb"/></g>
      <rect x="25.6" y="12" width="2.8" height="22" rx="1.4" fill="#5d6a8a"/>
    </svg>
  </div>
  <div class="flutter f3" aria-hidden="true">
    <svg width="40" height="33" viewBox="0 0 54 44">
      <g class="wingL"><path d="M27 22 C14 2 0 4 3 16 C5 24 16 24 27 22Z" fill="#fbd9a6"/><path d="M27 23 C16 26 6 34 12 40 C18 44 25 34 27 23Z" fill="#fde8c9"/></g>
      <g class="wingR"><path d="M27 22 C40 2 54 4 51 16 C49 24 38 24 27 22Z" fill="#fbd9a6"/><path d="M27 23 C38 26 48 34 42 40 C36 44 29 34 27 23Z" fill="#fde8c9"/></g>
      <rect x="25.6" y="12" width="2.8" height="22" rx="1.4" fill="#7a5a3f"/>
    </svg>
  </div>

  <main>
    <header>
      <!-- ผีเสื้อตัวหลัก -->
      <svg class="hero-bfly" viewBox="0 0 120 96" aria-hidden="true">
        <defs>
          <linearGradient id="wg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2d4"/><stop offset="1" stop-color="#f48fb1"/></linearGradient>
          <linearGradient id="wg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe0ea"/><stop offset="1" stop-color="#f9b3c9"/></linearGradient>
        </defs>
        <path d="M60 46 C40 4 6 6 8 32 C10 50 36 52 60 46Z" fill="url(#wg1)"/>
        <path d="M60 46 C80 4 114 6 112 32 C110 50 84 52 60 46Z" fill="url(#wg1)"/>
        <path d="M60 50 C40 54 20 70 30 84 C40 94 56 74 60 50Z" fill="url(#wg2)"/>
        <path d="M60 50 C80 54 100 70 90 84 C80 94 64 74 60 50Z" fill="url(#wg2)"/>
        <g fill="#fff" opacity=".8"><circle cx="28" cy="28" r="5"/><circle cx="92" cy="28" r="5"/><circle cx="38" cy="76" r="3.5"/><circle cx="82" cy="76" r="3.5"/></g>
        <rect x="57" y="26" width="6" height="46" rx="3" fill="#7a5263"/>
        <path d="M59 27 C55 16 50 12 46 11 M61 27 C65 16 70 12 74 11" stroke="#7a5263" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="46" cy="11" r="2.5" fill="#7a5263"/><circle cx="74" cy="11" r="2.5" fill="#7a5263"/>
      </svg>
      <h1>Butterfly <span>Garden</span></h1>
      <p class="sub">ทำนายสายพันธุ์ผีเสื้อด้วย YOLO11 · รันบนเบราว์เซอร์ด้วย ONNX Runtime Web</p>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">กำลังโหลดโมเดล…</span></div>
    </header>

    <div class="grid">
      <!-- ===== ฝั่งซ้าย: อัปโหลดรูป + แสดงกรอบ ===== -->
      <section class="card">
        <h2><span class="ic">🌷</span>อัปโหลดรูปผีเสื้อ</h2>
        <label id="drop" class="drop">
          <input type="file" id="imageInput" accept="image/*" />
          <div class="empty">
            <svg class="flower" viewBox="0 0 60 60" aria-hidden="true">
              <g fill="#f7b6c8"><circle cx="30" cy="16" r="10"/><circle cx="44" cy="28" r="10"/><circle cx="38" cy="44" r="10"/><circle cx="22" cy="44" r="10"/><circle cx="16" cy="28" r="10"/></g>
              <circle cx="30" cy="31" r="8" fill="#ffe08f"/>
            </svg>
            <div class="big">คลิกหรือลากรูปมาวางตรงนี้</div>
            <div class="hint">รองรับ JPG / PNG · ประมวลผลในเครื่อง ไม่อัปโหลดขึ้นเซิร์ฟเวอร์</div>
          </div>
          <canvas id="canvas" width="640" height="640"></canvas>
        </label>

        <div class="tools">
          <label for="conf">ความมั่นใจขั้นต่ำ <b id="confVal">35%</b></label>
          <input type="range" id="conf" min="5" max="95" value="35" />
          <button class="btn ghost" id="resetBtn" type="button">เลือกรูปใหม่</button>
        </div>
      </section>

      <!-- ===== ฝั่งขวา: ผลการทำนาย ===== -->
      <section class="card">
        <h2><span class="ic">🦋</span>ผลการทำนาย</h2>
        <div id="label">
          <div class="result-empty">
            <svg viewBox="0 0 60 60" aria-hidden="true">
              <path d="M30 56 V28" stroke="#79b98b" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="22" cy="40" rx="9" ry="4.5" fill="#a8d5b4" transform="rotate(-30 22 40)"/>
              <ellipse cx="38" cy="36" rx="9" ry="4.5" fill="#a8d5b4" transform="rotate(30 38 36)"/>
              <g fill="#f7b6c8"><circle cx="30" cy="14" r="7"/><circle cx="39" cy="21" r="7"/><circle cx="21" cy="21" r="7"/><circle cx="30" cy="26" r="6"/></g>
              <circle cx="30" cy="20" r="4.5" fill="#ffe08f"/>
            </svg>
            <div>ยังไม่มีผล · ลองอัปโหลดรูปดูนะ</div>
          </div>
        </div>
        <div style="margin-top:14px;font-size:13px;color:var(--ink-soft)">สายพันธุ์ที่โมเดลรู้จัก</div>
        <div class="classes" id="classChips"></div>
      </section>
    </div>

    <footer>
      <svg viewBox="0 0 120 20" aria-hidden="true">
        <path d="M0 16 Q30 4 60 12 T120 10" fill="none" stroke="#a8d5b4" stroke-width="2"/>
        <g fill="#f7b6c8"><circle cx="20" cy="10" r="3"/><circle cx="60" cy="12" r="3"/><circle cx="100" cy="9" r="3"/></g>
      </svg>
      YOLO11n · Butterfly Detection · Monarch · Blue Morpho · Swallowtail
    </footer>
  </main>
</body>
</html>
